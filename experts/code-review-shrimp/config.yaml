temperature: 0.2

# Standalone Hermes has no audited local read-only file/repo bundle. Keep this profile prompt-only;
# run repository review through CrewClaw's capability gateway.
toolsets: []

platform_toolsets:
  cli:
    - no_mcp

coding_context: off

agent:
  disabled_toolsets: [browser, code_execution, file, skills, terminal]

plugins:
  enabled: []

approvals:
  mode: manual
